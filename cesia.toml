[project]
name = "cepheus"
src = ["cesia"]

[native]
package = "cesia/cepheus"
natives = ["kind", "connect", "get", "insert", "update", "write", "variables", "find", "fork", "close", "watch", "next", "put", "read", "delete", "erase"]

[test]
allow = ["native=cepheus", "net=own"]

# cesia doc --site: the site of Cepheus, its book and the reference of its Cesia package.
[site]
title = "Cepheus"
source = "https://github.com/www-celestial/cepheus/blob/main/"
color = "#0c8599"
