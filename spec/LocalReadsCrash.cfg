\* The rule built with a server death (its frame in flight kept or lost), one reader and remote reads,
\* three writes: every read is linearizable (tools/tlc.sh).
CONSTANTS
  Readers = {r1}
  MaxWrites = 3
  MaxCrashes = 1
  MaxTime = 0
  L = 1
  Rule = "word"
SPECIFICATION Spec
INVARIANTS Linearizable AnsweredDurable
