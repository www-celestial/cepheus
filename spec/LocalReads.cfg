  Readers = {r1, r2}
  MaxWrites = 3
  MaxCrashes = 0
  MaxTime = 0
  L = 1
  Rule = "word"
SPECIFICATION Spec
SYMMETRY ReaderSymmetry
INVARIANTS Linearizable AnsweredDurable
