name: pages

# The site of Cepheus, its book and the reference of its Cesia package, as tools/site.sh makes it with cesia doc --site from
# this commit: built for each pull request, and published on GitHub Pages from main. It runs on the nightly Cesia, as its
# release gives it. A formula that can't be written, a link that leads nowhere, a French page that drifts from its English
# one, or a Cesia example that doesn't check, stops the build, and the site in place stays as it was.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      built: ${{ steps.site.outputs.built }}
    steps:
      - uses: actions/checkout@v7
      - name: Cesia nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cesia-linux-x86_64.tar.gz
          if ! gh release download nightly --repo www-celestial/cesia-lang --pattern "$archive*" --dir download; then
            echo "Cesia has no nightly release yet: nothing to build the site with."
            echo "NO_CESIA=1" >> "$GITHUB_ENV"
            exit 0
          fi
          (cd download && [ "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(cut -d' ' -f1 < "$archive.sha256")" ])
          mkdir -p "$HOME/.cesia"
          tar -xzf "download/$archive" -C "$HOME/.cesia"
          echo "$HOME/.cesia/bin" >> "$GITHUB_PATH"
      - name: Site
        id: site
        if: env.NO_CESIA != '1'
        run: |
          cesia version
          tools/site.sh _site
          echo "built=1" >> "$GITHUB_OUTPUT"
      # What the build keeps for itself: what lets the next build skip a page that didn't change.
      - name: Only the pages
        if: env.NO_CESIA != '1'
        run: rm -rf _site/.pages _site/.reference _site/.book
      - uses: actions/upload-pages-artifact@v5
        if: env.NO_CESIA != '1'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.built == '1'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
