name: pages

# The site of Cepheus, its book and the reference of its Cesia package, as cesia doc --site makes them from this commit, on
# the nightly Cesia, as its release gives it: a check, nothing published, since the repository is private and the site is
# read where it is built, with cesia doc --site --open. A formula that can't be written, a link that leads nowhere, a French
# page that drifts from its English one, or a Cesia example that doesn't check, fails it.
on:
  push:
    branches: [main]
  pull_request:
  # By hand too, Run workflow on main: the site again, with a new nightly Cesia.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Cesia nightly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive=cesia-linux-x86_64.tar.gz
          if ! gh release download nightly --repo www-celestial/cesia-lang --pattern "$archive*" --dir download; then
            echo "Cesia has no nightly release yet: nothing to build the site with."
            echo "NO_CESIA=1" >> "$GITHUB_ENV"
            exit 0
          fi
          (cd download && [ "$(sha256sum "$archive" | cut -d' ' -f1)" = "$(cut -d' ' -f1 < "$archive.sha256")" ])
          mkdir -p "$HOME/.cesia"
          tar -xzf "download/$archive" -C "$HOME/.cesia"
          echo "$HOME/.cesia/bin" >> "$GITHUB_PATH"
      - name: Site
        if: env.NO_CESIA != '1'
        run: |
          cesia version
          cesia doc --site _site
