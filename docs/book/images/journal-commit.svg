<svg xmlns="http://www.w3.org/2000/svg" width="712" height="409" viewBox="0 0 712 409">
<title>Group commit: writes that come during an fsync share the next one; the frames of a journal segment</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.bg{fill:#ffffff}
.row{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.cur{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.frame{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.2;stroke-dasharray:4 3}
.dash{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 3}
.br{stroke:#3a5ad9;stroke-width:1.4;fill:none}
.gr{stroke:#57606a;stroke-width:1.2;fill:none}
.grid{stroke:#eaeef2;stroke-width:1}
.axis{stroke:#8c959f;stroke-width:1}
.fa{fill:#3a5ad9}
.fs{fill:#57606a}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.bg{fill:#0d1117}
.row{fill:#161b22;stroke:#3d444d}
.box{fill:#1c2128;stroke:#3d444d}
.cur{fill:#1f2a4d;stroke:#8fa8ff}
.frame{fill:#1f2a4d;stroke:#8fa8ff}
.dash{stroke:#6e7681}
.br{stroke:#8fa8ff}
.gr{stroke:#9198a1}
.grid{stroke:#262c36}
.axis{stroke:#6e7681}
.fa{fill:#8fa8ff}
.fs{fill:#9198a1}
}
</style>
<rect class="bg" width="712" height="409"/>
<text class="h" x="16" y="48">programs</text>
<text class="h" x="16" y="96">writer</text>
<text class="h" x="16" y="156">syncer</text>
<line class="grid" x1="110" y1="44" x2="700" y2="44"/>
<line class="grid" x1="110" y1="92" x2="700" y2="92"/>
<line class="grid" x1="110" y1="152" x2="700" y2="152"/>
<line class="gr" x1="116" y1="30" x2="116" y2="78"/>
<polygon class="fs" points="116.0,84.0 120.0,76.0 112.0,76.0"/>
<text class="c s" xml:space="preserve" x="116" y="26" text-anchor="middle">w1</text>
<rect class="frame" x="115" y="85" width="14" height="14" rx="2"/>
<line class="gr" x1="142" y1="30" x2="142" y2="78"/>
<polygon class="fs" points="142.0,84.0 146.0,76.0 138.0,76.0"/>
<text class="c s" xml:space="preserve" x="142" y="26" text-anchor="middle">w2</text>
<rect class="frame" x="141" y="85" width="14" height="14" rx="2"/>
<line class="gr" x1="199" y1="30" x2="199" y2="78"/>
<polygon class="fs" points="199.0,84.0 203.0,76.0 195.0,76.0"/>
<text class="c s" xml:space="preserve" x="199" y="26" text-anchor="middle">w3</text>
<rect class="frame" x="198" y="85" width="14" height="14" rx="2"/>
<line class="gr" x1="250" y1="30" x2="250" y2="78"/>
<polygon class="fs" points="250.0,84.0 254.0,76.0 246.0,76.0"/>
<text class="c s" xml:space="preserve" x="250" y="26" text-anchor="middle">w4</text>
<rect class="frame" x="249" y="85" width="14" height="14" rx="2"/>
<line class="gr" x1="340" y1="30" x2="340" y2="78"/>
<polygon class="fs" points="340.0,84.0 344.0,76.0 336.0,76.0"/>
<text class="c s" xml:space="preserve" x="340" y="26" text-anchor="middle">w5</text>
<rect class="frame" x="339" y="85" width="14" height="14" rx="2"/>
<rect class="cur" x="126" y="140" width="192" height="24" rx="3"/>
<text class="a sm" x="134" y="156">frame 1: pwrite, fsync</text>
<line class="br" x1="318" y1="138" x2="318" y2="58"/>
<polygon class="fa" points="318.0,52.0 314.0,60.0 322.0,60.0"/>
<rect class="cur" x="324" y="140" width="192" height="24" rx="3"/>
<text class="a sm" x="332" y="156">frame 2: pwrite, fsync</text>
<line class="br" x1="516" y1="138" x2="516" y2="58"/>
<polygon class="fa" points="516.0,52.0 512.0,60.0 520.0,60.0"/>
<rect class="cur" x="522" y="140" width="180" height="24" rx="3"/>
<text class="a sm" x="530" y="156">frame 3</text>
<text class="a sm" x="324" y="66">w1 answered</text>
<text class="a sm" x="522" y="66">w2 w3 w4 answered</text>
<path class="br" d="M 140 106 v 6 H 264 v -6"/>
<text class="s sm" x="142" y="124">they wait together for frame 2</text>
<line class="axis" x1="110" y1="182" x2="700" y2="182"/>
<line class="axis" x1="110" y1="182" x2="110" y2="186"/>
<text class="s sm" x="110" y="198" text-anchor="middle">0</text>
<line class="axis" x1="174" y1="182" x2="174" y2="186"/>
<text class="s sm" x="174" y="198" text-anchor="middle">1</text>
<line class="axis" x1="238" y1="182" x2="238" y2="186"/>
<text class="s sm" x="238" y="198" text-anchor="middle">2</text>
<line class="axis" x1="302" y1="182" x2="302" y2="186"/>
<text class="s sm" x="302" y="198" text-anchor="middle">3</text>
<line class="axis" x1="366" y1="182" x2="366" y2="186"/>
<text class="s sm" x="366" y="198" text-anchor="middle">4</text>
<line class="axis" x1="430" y1="182" x2="430" y2="186"/>
<text class="s sm" x="430" y="198" text-anchor="middle">5</text>
<line class="axis" x1="494" y1="182" x2="494" y2="186"/>
<text class="s sm" x="494" y="198" text-anchor="middle">6</text>
<line class="axis" x1="558" y1="182" x2="558" y2="186"/>
<text class="s sm" x="558" y="198" text-anchor="middle">7</text>
<line class="axis" x1="622" y1="182" x2="622" y2="186"/>
<text class="s sm" x="622" y="198" text-anchor="middle">8</text>
<line class="axis" x1="686" y1="182" x2="686" y2="186"/>
<text class="s sm" x="686" y="198" text-anchor="middle">9</text>
<text class="s sm" x="16" y="198">ms</text>
<text class="s sm" x="16" y="216">An fsync takes about 3 ms on the test machine's SSD: one for frame 1's group, one for the 3 groups of</text>
<text class="s sm" x="16" y="233">frame 2.</text>
<text class="c h" xml:space="preserve" x="16" y="272">DIR/journal/00000000000000000001.seg</text>
<rect class="box" x="16" y="284" width="56" height="40"/>
<text class="sm" x="44" y="301" text-anchor="middle">segment</text>
<text class="c s sm" xml:space="preserve" x="44" y="317" text-anchor="middle">40 B</text>
<rect class="cur" x="72" y="284" width="60" height="40"/>
<text class="sm" x="102" y="301" text-anchor="middle">header</text>
<text class="c s sm" xml:space="preserve" x="102" y="317" text-anchor="middle">28 B</text>
<rect class="row" x="132" y="284" width="170" height="40"/>
<text class="sm" x="217" y="301" text-anchor="middle">groups, in columns</text>
<text class="c s sm" xml:space="preserve" x="217" y="317" text-anchor="middle">frame 1</text>
<rect class="cur" x="302" y="284" width="60" height="40"/>
<text class="sm" x="332" y="301" text-anchor="middle">trailer</text>
<text class="c s sm" xml:space="preserve" x="332" y="317" text-anchor="middle">16 B</text>
<rect class="cur" x="362" y="284" width="60" height="40"/>
<text class="sm" x="392" y="301" text-anchor="middle">header</text>
<text class="c s sm" xml:space="preserve" x="392" y="317" text-anchor="middle">28 B</text>
<rect class="row" x="422" y="284" width="170" height="40"/>
<text class="sm" x="507" y="301" text-anchor="middle">groups, in columns</text>
<text class="c s sm" xml:space="preserve" x="507" y="317" text-anchor="middle">frame 2</text>
<rect class="cur" x="592" y="284" width="60" height="40"/>
<text class="sm" x="622" y="301" text-anchor="middle">trailer</text>
<text class="c s sm" xml:space="preserve" x="622" y="317" text-anchor="middle">16 B</text>
<line class="dash" x1="652" y1="304" x2="692" y2="304"/>
<text class="s sm" x="696" y="272" text-anchor="end">only ever appended to</text>
<text class="s" x="16" y="348">A frame's header: magic CPHF, body length, first group, group count, body CRC, header CRC;</text>
<text class="s" x="16" y="365">its trailer repeats the length and both CRCs. A frame holds whole groups: a crash leaves a</text>
<text class="s" x="16" y="382">group whole or absent.</text>
</svg>
