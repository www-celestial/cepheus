<svg xmlns="http://www.w3.org/2000/svg" width="860" height="272" viewBox="0 0 860 272">
<title>An index of two properties: how many times faster each side was with main and is now, question by question</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.off{fill:#8c959f}
.bg{fill:#ffffff}
.gr{stroke:#57606a;stroke-width:1.2;fill:none}
.grid{stroke:#eaeef2;stroke-width:1}
.axis{stroke:#8c959f;stroke-width:1}
.fs{fill:#57606a}
.s1{fill:#257de0}
.s2{fill:#f47230}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.off{fill:#6e7681}
.bg{fill:#0d1117}
.gr{stroke:#9198a1}
.grid{stroke:#262c36}
.axis{stroke:#6e7681}
.fs{fill:#9198a1}
.s1{fill:#338ced}
.s2{fill:#e76624}
}
</style>
<rect class="bg" width="860" height="272"/>
<text class="h" x="16" y="22">An index of two properties, at 1 million facts: main, then the pair declared</text>
<text class="s sm" x="380" y="54" text-anchor="end">main → now · PostgreSQL</text>
<text class="a sm" x="568" y="54">Cepheus faster →</text>
<text class="sm" x="552" y="54" text-anchor="end">← PostgreSQL faster</text>
<text class="s sm" x="742" y="54">main → now</text>
<line class="grid" x1="512" y1="68" x2="512" y2="180"/>
<text class="s sm" x="512" y="78" text-anchor="middle">2×</text>
<line class="grid" x1="560" y1="68" x2="560" y2="180"/>
<text class="s sm" x="560" y="78" text-anchor="middle">1×</text>
<line class="grid" x1="608" y1="68" x2="608" y2="180"/>
<text class="s sm" x="608" y="78" text-anchor="middle">2×</text>
<line class="grid" x1="656" y1="68" x2="656" y2="180"/>
<text class="s sm" x="656" y="78" text-anchor="middle">4×</text>
<line class="grid" x1="704" y1="68" x2="704" y2="180"/>
<text class="s sm" x="704" y="78" text-anchor="middle">8×</text>
<line class="axis" x1="560" y1="68" x2="560" y2="180"/>
<text class="sm" x="16" y="99">Each, Limit: 3 (LATERAL)</text>
<text class="s sm" x="380" y="99" text-anchor="end">131 ms → 30.8 ms · 52.3 ms</text>
<line class="gr" x1="497" y1="95" x2="583" y2="95"/>
<polygon class="fs" points="589.0,95.0 581.0,91.0 581.0,99.0"/>
<circle class="bg" cx="497" cy="95" r="6"/>
<circle class="off" cx="497" cy="95" r="4"/>
<circle class="bg" cx="596" cy="95" r="7"/>
<circle class="s1" cx="596" cy="95" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="99"><tspan class="s2">2.5×</tspan><tspan class="s"> → </tspan><tspan class="a h">1.7×</tspan></text>
<text class="sm" x="16" y="123">Limit: 1 (DISTINCT ON)</text>
<text class="s sm" x="380" y="123" text-anchor="end">95.6 ms → 12.4 ms · 115 ms</text>
<line class="gr" x1="572" y1="119" x2="701" y2="119"/>
<polygon class="fs" points="707.0,119.0 699.0,115.0 699.0,123.0"/>
<circle class="bg" cx="572" cy="119" r="6"/>
<circle class="off" cx="572" cy="119" r="4"/>
<circle class="bg" cx="714" cy="119" r="7"/>
<circle class="s1" cx="714" cy="119" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="123"><tspan class="a">1.2×</tspan><tspan class="s"> → </tspan><tspan class="a h">9.3×</tspan></text>
<text class="sm" x="16" y="147">a client's 10 latest (an index scan)</text>
<text class="s sm" x="380" y="147" text-anchor="end">60.1 µs → 13.1 µs · 100 µs</text>
<line class="gr" x1="595" y1="143" x2="688" y2="143"/>
<polygon class="fs" points="694.0,143.0 686.0,139.0 686.0,147.0"/>
<circle class="bg" cx="595" cy="143" r="6"/>
<circle class="off" cx="595" cy="143" r="4"/>
<circle class="bg" cx="701" cy="143" r="7"/>
<circle class="s1" cx="701" cy="143" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="147"><tspan class="a">1.7×</tspan><tspan class="s"> → </tspan><tspan class="a h">7.6×</tspan></text>
<text class="s sm" x="30" y="171">the 10 after them (a keyset)</text>
<text class="s sm" x="380" y="171" text-anchor="end">62.9 µs → 47.9 µs · 157 µs</text>
<line class="gr" x1="623" y1="167" x2="629" y2="167"/>
<polygon class="fs" points="635.0,167.0 627.0,163.0 627.0,171.0"/>
<circle class="bg" cx="623" cy="167" r="6"/>
<circle class="off" cx="623" cy="167" r="4"/>
<circle class="bg" cx="642" cy="167" r="7"/>
<circle class="s1" cx="642" cy="167" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="171"><tspan class="a">2.5×</tspan><tspan class="s"> → </tspan><tspan class="a h">3.3×</tspan></text>
<text class="s" x="16" y="204">The grey dot is main's binaries (e3a9b29, no index of two properties), the coloured one now (invoice/date within</text>
<text class="s" x="16" y="221">invoice/client), on a log scale of PostgreSQL 18.6's time over Cepheus's, PostgreSQL with its index on (client, date</text>
<text class="s" x="16" y="238">DESC, id): the median of 21 rounds alternated on the same rows. A ratio in blue, Cepheus is faster; in orange,</text>
<text class="s" x="16" y="255">PostgreSQL; in grey, within 10 %. Times: docs/book/benchmarks.md.</text>
</svg>
