<svg xmlns="http://www.w3.org/2000/svg" width="860" height="313" viewBox="0 0 860 313">
<title>Each over an index of two properties: how many times faster each side was with main and is now, question by question</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.off{fill:#8c959f}
.bg{fill:#ffffff}
.gr{stroke:#57606a;stroke-width:1.2;fill:none}
.grid{stroke:#eaeef2;stroke-width:1}
.axis{stroke:#8c959f;stroke-width:1}
.fs{fill:#57606a}
.s1{fill:#257de0}
.s2{fill:#f47230}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.off{fill:#6e7681}
.bg{fill:#0d1117}
.gr{stroke:#9198a1}
.grid{stroke:#262c36}
.axis{stroke:#6e7681}
.fs{fill:#9198a1}
