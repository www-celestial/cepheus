.s2{fill:#e76624}
}
</style>
<rect class="bg" width="860" height="313"/>
<text class="h" x="16" y="22">Each over an index of two properties, at 1 million facts: main, then now</text>
<text class="s sm" x="380" y="54" text-anchor="end">main → now · PostgreSQL</text>
<text class="a sm" x="508" y="38">Cepheus faster →</text>
<text class="sm" x="492" y="38" text-anchor="end">← PostgreSQL faster</text>
<text class="s sm" x="742" y="54">main → now</text>
<line class="grid" x1="466" y1="68" x2="466" y2="204"/>
<text class="s sm" x="466" y="78" text-anchor="middle">2×</text>
<line class="grid" x1="500" y1="68" x2="500" y2="204"/>
<text class="s sm" x="500" y="78" text-anchor="middle">1×</text>
<line class="grid" x1="534" y1="68" x2="534" y2="204"/>
<text class="s sm" x="534" y="78" text-anchor="middle">2×</text>
<line class="grid" x1="569" y1="68" x2="569" y2="204"/>
<text class="s sm" x="569" y="78" text-anchor="middle">4×</text>
<line class="grid" x1="603" y1="68" x2="603" y2="204"/>
<text class="s sm" x="603" y="78" text-anchor="middle">8×</text>
<line class="grid" x1="638" y1="68" x2="638" y2="204"/>
<text class="s sm" x="638" y="78" text-anchor="middle">16×</text>
<line class="grid" x1="673" y1="68" x2="673" y2="204"/>
<text class="s sm" x="673" y="78" text-anchor="middle">32×</text>
<line class="grid" x1="707" y1="68" x2="707" y2="204"/>
<text class="s sm" x="707" y="78" text-anchor="middle">64×</text>
<line class="axis" x1="500" y1="68" x2="500" y2="204"/>
<text class="sm" x="16" y="99">Each, Limit: 3 (LATERAL)</text>
<text class="s sm" x="380" y="99" text-anchor="end">35.0 ms → 14.0 ms · 61.3 ms</text>
<line class="gr" x1="527" y1="95" x2="560" y2="95"/>
<polygon class="fs" points="566.0,95.0 558.0,91.0 558.0,99.0"/>
<circle class="bg" cx="527" cy="95" r="6"/>
<circle class="off" cx="527" cy="95" r="4"/>
<circle class="bg" cx="573" cy="95" r="7"/>
<circle class="s1" cx="573" cy="95" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="99"><tspan class="a">1.8×</tspan><tspan class="s"> → </tspan><tspan class="a h">4.4×</tspan></text>
<text class="sm" x="16" y="123">Limit: 1 (DISTINCT ON)</text>
<text class="s sm" x="380" y="123" text-anchor="end">14.7 ms → 4.87 ms · 141 ms</text>
<line class="gr" x1="612" y1="119" x2="655" y2="119"/>
<polygon class="fs" points="661.0,119.0 653.0,115.0 653.0,123.0"/>
<circle class="bg" cx="612" cy="119" r="6"/>
<circle class="off" cx="612" cy="119" r="4"/>
<circle class="bg" cx="668" cy="119" r="7"/>
<circle class="s1" cx="668" cy="119" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="123"><tspan class="a">9.6×</tspan><tspan class="s"> → </tspan><tspan class="a h">29.0×</tspan></text>
<text class="sm" x="16" y="147">a client's 10 latest (an index scan)</text>
<text class="s sm" x="380" y="147" text-anchor="end">14.1 µs → 14.1 µs · 106 µs</text>
<line class="gr" x1="600" y1="143" x2="600" y2="143"/>
<circle class="bg" cx="600" cy="143" r="6"/>
<circle class="off" cx="600" cy="143" r="4"/>
<circle class="bg" cx="600" cy="143" r="7"/>
<circle class="s1" cx="600" cy="143" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="147"><tspan class="a">7.5×</tspan><tspan class="s"> → </tspan><tspan class="a h">7.5×</tspan></text>
<text class="s sm" x="30" y="171">the 10 after them (a keyset)</text>
<text class="s sm" x="380" y="171" text-anchor="end">33.9 µs → 35.0 µs · 155 µs</text>
<line class="gr" x1="575" y1="167" x2="574" y2="167"/>
<circle class="bg" cx="575" cy="167" r="6"/>
<circle class="off" cx="575" cy="167" r="4"/>
<circle class="bg" cx="574" cy="167" r="7"/>
<circle class="s1" cx="574" cy="167" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="171"><tspan class="a">4.6×</tspan><tspan class="s"> → </tspan><tspan class="a h">4.4×</tspan></text>
<text class="sm" x="16" y="195">Each, Limit: 3, no pair (LATERAL)</text>
<text class="s sm" x="380" y="195" text-anchor="end">169 ms → 175 ms · 61.3 ms</text>
<line class="gr" x1="450" y1="191" x2="448" y2="191"/>
<circle class="bg" cx="450" cy="191" r="6"/>
<circle class="off" cx="450" cy="191" r="4"/>
<circle class="bg" cx="448" cy="191" r="7"/>
<circle class="s2" cx="448" cy="191" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="195"><tspan class="s2">2.8×</tspan><tspan class="s"> → </tspan><tspan class="s2 h">2.9×</tspan></text>
<text class="s" x="16" y="228">The grey dot is main's binaries (636fe67: the pair read, a buffer a group in Each), the coloured one now (the rows laid</text>
<text class="s" x="16" y="245">flat, sorted once), invoice/date within invoice/client, the last row on the database without it; on a log scale of</text>
<text class="s" x="16" y="262">PostgreSQL 18.6's time over Cepheus's, PostgreSQL with its index on (client, date DESC, id): the median of 21 rounds</text>
<text class="s" x="16" y="279">alternated on the same rows. A ratio in blue, Cepheus is faster; in orange, PostgreSQL; in grey, within 10 %. Times:</text>
<text class="s" x="16" y="296">docs/book/benchmarks.md.</text>
</svg>
