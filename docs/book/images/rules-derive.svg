<svg xmlns="http://www.w3.org/2000/svg" width="712" height="348" viewBox="0 0 712 348">
<title>A rule's facts derived by the writer, then retracted with their premise (Backward/Forward)</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.del{fill:#cf222e}
.bg{fill:#ffffff}
.row{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cur{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.rowdel{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.ldel{stroke:#cf222e;stroke-width:1.4;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.del{fill:#f85149}
.bg{fill:#0d1117}
.row{fill:#161b22;stroke:#3d444d}
.cur{fill:#1f2a4d;stroke:#8fa8ff}
.rowdel{fill:#2d1517;stroke:#f85149}
.ldel{stroke:#f85149}
}
</style>
<rect class="bg" width="712" height="348"/>
<text class="c" xml:space="preserve" x="16" y="22">is-a: [x, thing/type, c], [c, class/parent, d] =&gt; [x, thing/type, d]</text>
<text class="c s" xml:space="preserve" x="16" y="40">#65536 invoice   #65537 document   #65538 record   #65539 x</text>
<text class="h" x="16" y="66">group 5: Add [#65539 thing/type #65536]</text>
<text class="h" x="368" y="66">group 6: Retract [#65539 thing/type #65536]</text>
<rect class="row" x="16" y="78" width="336" height="22"/>
<text class="c" xml:space="preserve" x="24" y="94">[#65536 class/parent #65537]</text>
<text class="s sm" x="344" y="94" text-anchor="end"></text>
<rect class="row" x="16" y="104" width="336" height="22"/>
<text class="c" xml:space="preserve" x="24" y="120">[#65537 class/parent #65538]</text>
<text class="s sm" x="344" y="120" text-anchor="end"></text>
<rect class="row" x="16" y="130" width="336" height="22"/>
<text class="c" xml:space="preserve" x="24" y="146">[#65539 thing/type #65536]</text>
<text class="s sm" x="344" y="146" text-anchor="end"></text>
<rect class="cur" x="16" y="156" width="336" height="22"/>
<text class="c" xml:space="preserve" x="24" y="172">[#65539 thing/type #65537]</text>
<text class="a sm" x="344" y="172" text-anchor="end">derived by is-a</text>
<rect class="cur" x="16" y="182" width="336" height="22"/>
<text class="c" xml:space="preserve" x="24" y="198">[#65539 thing/type #65538]</text>
<text class="a sm" x="344" y="198" text-anchor="end">derived by is-a</text>
<rect class="row" x="368" y="78" width="336" height="22"/>
<text class="c" xml:space="preserve" x="376" y="94">[#65536 class/parent #65537]</text>
<text class="s sm" x="696" y="94" text-anchor="end"></text>
<rect class="row" x="368" y="104" width="336" height="22"/>
<text class="c" xml:space="preserve" x="376" y="120">[#65537 class/parent #65538]</text>
<text class="s sm" x="696" y="120" text-anchor="end"></text>
<rect class="rowdel" x="368" y="130" width="336" height="22"/>
<text class="c del" xml:space="preserve" x="376" y="146">[#65539 thing/type #65536]</text>
<line class="ldel" x1="374" y1="141" x2="573" y2="141"/>
<text class="del sm" x="696" y="146" text-anchor="end">retracted</text>
<rect class="rowdel" x="368" y="156" width="336" height="22"/>
<text class="c del" xml:space="preserve" x="376" y="172">[#65539 thing/type #65537]</text>
<line class="ldel" x1="374" y1="167" x2="573" y2="167"/>
<text class="del sm" x="696" y="172" text-anchor="end">no proof left: goes</text>
<rect class="rowdel" x="368" y="182" width="336" height="22"/>
<text class="c del" xml:space="preserve" x="376" y="198">[#65539 thing/type #65538]</text>
<line class="ldel" x1="374" y1="193" x2="573" y2="193"/>
<text class="del sm" x="696" y="198" text-anchor="end">no proof left: goes</text>
<text class="h" x="16" y="230">why [#65539 thing/type #65538] at group 5:</text>
<text class="c a" xml:space="preserve" x="16" y="250">[#65539 thing/type #65538] by is-a</text>
<text class="c a" xml:space="preserve" x="32" y="268">[#65539 thing/type #65537] by is-a</text>
<text class="c" xml:space="preserve" x="48" y="286">given [#65539 thing/type #65536]</text>
<text class="c" xml:space="preserve" x="48" y="304">given [#65536 class/parent #65537]</text>
<text class="c" xml:space="preserve" x="32" y="322">given [#65537 class/parent #65538]</text>
<text class="h" x="368" y="230">A derived fact alone is not retracted:</text>
<text class="c del" xml:space="preserve" x="368" y="250">Retract [#65539 thing/type #65537]</text>
<text class="c s" xml:space="preserve" x="368" y="270">invalid: [#65539 thing/type #65537] is</text>
<text class="c s" xml:space="preserve" x="368" y="288">derived by rule is-a from [#65539 thing/type</text>
<text class="c s" xml:space="preserve" x="368" y="306">#65536] and [#65536 class/parent #65537]:</text>
<text class="c s" xml:space="preserve" x="368" y="324">retract one of those</text>
</svg>
