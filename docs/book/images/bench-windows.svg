<svg xmlns="http://www.w3.org/2000/svg" width="712" height="508" viewBox="0 0 712 508">
<title>Windows and Each beside PostgreSQL: how many times faster each side is, question by question</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
