<svg xmlns="http://www.w3.org/2000/svg" width="712" height="352" viewBox="0 0 712 352">
<title>Two pages of invoices, the largest first, with a write between them: After against OFFSET</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.add{fill:#1a7f37}
.del{fill:#cf222e}
.bg{fill:#ffffff}
.row{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cur{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.rowadd{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.br{stroke:#3a5ad9;stroke-width:1.4;fill:none}
.ldel{stroke:#cf222e;stroke-width:1.4;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.add{fill:#3fb950}
.del{fill:#f85149}
.bg{fill:#0d1117}
.row{fill:#161b22;stroke:#3d444d}
.cur{fill:#1f2a4d;stroke:#8fa8ff}
.rowadd{fill:#12261e;stroke:#3fb950}
.br{stroke:#8fa8ff}
.ldel{stroke:#f85149}
}
</style>
<rect class="bg" width="712" height="352"/>
<text class="c" xml:space="preserve" x="16" y="22">Sort: [cepheus.Desc(t)]   Limit: 3   After: after</text>
<text class="h" x="16" y="52">Page 1, at its group</text>
<text class="h" x="330" y="52">Page 2: a new invoice meanwhile</text>
<rect class="row" x="16" y="72" width="180" height="22"/>
<text x="26" y="88">Ada Martin</text>
<text x="186" y="88" text-anchor="end">300.00</text>
<rect class="row" x="16" y="98" width="180" height="22"/>
<text x="26" y="114">Bo Lind</text>
<text x="186" y="114" text-anchor="end">280.00</text>
<rect class="cur" x="16" y="124" width="180" height="22"/>
<text x="26" y="140">Ada Martin</text>
<text x="186" y="140" text-anchor="end">270.00</text>
<rect class="row" x="16" y="150" width="180" height="22"/>
<text x="26" y="166">Bo Lind</text>
<text x="186" y="166" text-anchor="end">250.00</text>
<rect class="row" x="16" y="176" width="180" height="22"/>
<text x="26" y="192">Ada Martin</text>
<text x="186" y="192" text-anchor="end">240.00</text>
<rect class="row" x="16" y="202" width="180" height="22"/>
<text x="26" y="218">Bo Lind</text>
<text x="186" y="218" text-anchor="end">220.00</text>
<rect class="row" x="16" y="228" width="180" height="22"/>
<text x="26" y="244">Ada Martin</text>
<text x="186" y="244" text-anchor="end">210.00</text>
<rect class="row" x="16" y="254" width="180" height="22"/>
<text x="26" y="270">Bo Lind</text>
<text x="186" y="270" text-anchor="end">190.00</text>
<path class="br" d="M 202 74 h 8 V 144 h -8"/>
<text class="a" x="216" y="102">Limit: 3</text>
<text class="a" x="216" y="132">the cursor:</text>
<text class="c a" xml:space="preserve" x="216" y="148">first[3]</text>
<rect class="rowadd" x="330" y="72" width="180" height="22"/>
<text x="340" y="88">Ada Martin</text>
<text x="500" y="88" text-anchor="end">1,000.00</text>
<text class="add sm" x="520" y="88">written between the pages</text>
<rect class="row" x="330" y="98" width="180" height="22"/>
<text x="340" y="114">Ada Martin</text>
<text x="500" y="114" text-anchor="end">300.00</text>
<rect class="row" x="330" y="124" width="180" height="22"/>
<text x="340" y="140">Bo Lind</text>
<text x="500" y="140" text-anchor="end">280.00</text>
<rect class="cur" x="330" y="150" width="180" height="22"/>
<text x="340" y="166">Ada Martin</text>
<text x="500" y="166" text-anchor="end">270.00</text>
<rect class="row" x="330" y="176" width="180" height="22"/>
<text x="340" y="192">Bo Lind</text>
<text x="500" y="192" text-anchor="end">250.00</text>
<rect class="row" x="330" y="202" width="180" height="22"/>
<text x="340" y="218">Ada Martin</text>
<text x="500" y="218" text-anchor="end">240.00</text>
<rect class="row" x="330" y="228" width="180" height="22"/>
<text x="340" y="244">Bo Lind</text>
<text x="500" y="244" text-anchor="end">220.00</text>
<rect class="row" x="330" y="254" width="180" height="22"/>
<text x="340" y="270">Ada Martin</text>
<text x="500" y="270" text-anchor="end">210.00</text>
<rect class="row" x="330" y="280" width="180" height="22"/>
<text x="340" y="296">Bo Lind</text>
<text x="500" y="296" text-anchor="end">190.00</text>
<path class="br" d="M 516 178 h 8 V 248 h -8"/>
<text class="a" x="530" y="198">After: first[3]</text>
<text class="a" x="530" y="215">the 3 rows after it</text>
<path class="ldel" d="M 324 152 h -8 V 222 h 8"/>
<text class="del" x="312" y="166" text-anchor="end">OFFSET 3</text>
<text class="del sm" x="312" y="183" text-anchor="end">270.00 twice</text>
<text class="s" x="16" y="322">After goes on after the last row shown, whatever was written before it;</text>
<text class="s" x="16" y="339">OFFSET counts rows, and the new one pushed them down by one.</text>
</svg>
