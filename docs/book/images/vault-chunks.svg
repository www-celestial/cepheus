<line class="ldel" x1="197" y1="116" x2="197" y2="156"/>
<text class="s sm" x="16" y="172">18 of its 19 chunks found stored (1,418,282 of 1,500,100 bytes): only the chunks at the insertion are new (red)</text>
<rect class="cur" x="16" y="196" width="124" height="44" rx="4"/>
<text class="h sm" x="24" y="214">a chunk</text>
<text class="s sm" x="24" y="231">its bytes</text>
<line class="gr" x1="142" y1="218" x2="146" y2="218"/>
<polygon class="fs" points="152.0,218.0 144.0,214.0 144.0,222.0"/>
<rect class="box" x="154" y="196" width="124" height="44" rx="4"/>
<text class="h sm" x="162" y="214">named</text>
<text class="s sm" x="162" y="231">BLAKE2b-256, keyed</text>
<line class="gr" x1="280" y1="218" x2="284" y2="218"/>
<polygon class="fs" points="290.0,218.0 282.0,214.0 282.0,222.0"/>
<rect class="box" x="292" y="196" width="124" height="44" rx="4"/>
<text class="h sm" x="300" y="214">compressed</text>
<text class="s sm" x="300" y="231">LZ4 (cold: Zstd)</text>
<line class="gr" x1="418" y1="218" x2="422" y2="218"/>
<polygon class="fs" points="428.0,218.0 420.0,214.0 420.0,222.0"/>
<rect class="box" x="430" y="196" width="124" height="44" rx="4"/>
<text class="h sm" x="438" y="214">sealed</text>
<text class="s sm" x="438" y="231">AEGIS-256</text>
<line class="gr" x1="556" y1="218" x2="560" y2="218"/>
<polygon class="fs" points="566.0,218.0 558.0,214.0 558.0,222.0"/>
<rect class="box" x="568" y="196" width="124" height="44" rx="4"/>
<text class="h sm" x="576" y="214">stored once</text>
<text class="s sm" x="576" y="231">a record of a pack</text>
<text class="s" x="16" y="266">A node lists up to 1,024 children, each with the byte it ends at; the root names the file. A</text>
<text class="s" x="16" y="283">read walks from the root to the chunks under its range, by a binary search of the ends: a 4</text>
<text class="s" x="16" y="300">KiB read reads one chunk, two where it crosses a cut.</text>
</svg>
