<rect class="row" x="159" y="34" width="36" height="28"/>
<rect class="row" x="195" y="34" width="38" height="28"/>
<rect class="row" x="233" y="34" width="47" height="28"/>
<rect class="row" x="280" y="34" width="35" height="28"/>
<rect class="row" x="315" y="34" width="30" height="28"/>
<rect class="row" x="345" y="34" width="36" height="28"/>
<rect class="row" x="381" y="34" width="34" height="28"/>
<rect class="row" x="415" y="34" width="34" height="28"/>
<rect class="cur" x="449" y="34" width="37" height="28"/>
<rect class="cur" x="486" y="34" width="39" height="28"/>
<rect class="row" x="525" y="34" width="49" height="28"/>
<rect class="row" x="574" y="34" width="30" height="28"/>
<rect class="row" x="604" y="34" width="30" height="28"/>
<rect class="row" x="634" y="34" width="31" height="28"/>
<rect class="row" x="665" y="34" width="31" height="28"/>
<path class="br" d="M 469 32 v -6 h 30 v 6"/>
<text class="a sm" x="484" y="78" text-anchor="middle">Read(..., from = 1_000_000, len = 65_536): the 2 chunks under the range</text>
<text class="h" x="16" y="110">The same file with 100 bytes inserted at byte 400,000</text>
<rect class="row" x="16" y="122" width="38" height="28"/>
<rect class="row" x="54" y="122" width="31" height="28"/>
<rect class="row" x="85" y="122" width="44" height="28"/>
<rect class="row" x="129" y="122" width="30" height="28"/>
<rect class="row" x="159" y="122" width="36" height="28"/>
<rect class="rowdel" x="195" y="122" width="38" height="28"/>
<rect class="row" x="233" y="122" width="47" height="28"/>
<rect class="row" x="280" y="122" width="35" height="28"/>
<rect class="row" x="315" y="122" width="30" height="28"/>
<rect class="row" x="345" y="122" width="36" height="28"/>
<rect class="row" x="381" y="122" width="34" height="28"/>
<rect class="row" x="415" y="122" width="34" height="28"/>
<rect class="row" x="449" y="122" width="37" height="28"/>
