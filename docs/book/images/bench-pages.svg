<svg xmlns="http://www.w3.org/2000/svg" width="712" height="389" viewBox="0 0 712 389">
<title>The time of a page of 51 by id as a kind grows from 10,000 to 1,000,000 things: Cepheus, PostgreSQL, and the heap of before</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.off{fill:#8c959f}
.bg{fill:#ffffff}
.grid{stroke:#eaeef2;stroke-width:1}
.axis{stroke:#8c959f;stroke-width:1}
.s1{fill:#257de0}
.s2{fill:#f47230}
.k1{stroke:#257de0;stroke-width:2;fill:none}
.k2{stroke:#f47230;stroke-width:2;fill:none}
.ks{stroke:#8c959f;stroke-width:2;fill:none;stroke-dasharray:5 3}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.off{fill:#6e7681}
.bg{fill:#0d1117}
.grid{stroke:#262c36}
.axis{stroke:#6e7681}
.s1{fill:#338ced}
.s2{fill:#e76624}
.k1{stroke:#338ced}
.k2{stroke:#e76624}
.ks{stroke:#6e7681}
}
</style>
<rect class="bg" width="712" height="389"/>
<text class="h" x="16" y="22">A page of 51 by id, after the middle of the kind, one run</text>
<line class="grid" x1="90" y1="50" x2="520" y2="50"/>
<text class="s sm" x="84" y="54" text-anchor="end">100 ms</text>
<line class="grid" x1="90" y1="102" x2="520" y2="102"/>
<text class="s sm" x="84" y="106" text-anchor="end">10 ms</text>
<line class="grid" x1="90" y1="154" x2="520" y2="154"/>
<text class="s sm" x="84" y="158" text-anchor="end">1 ms</text>
<line class="grid" x1="90" y1="206" x2="520" y2="206"/>
<text class="s sm" x="84" y="210" text-anchor="end">100 µs</text>
<line class="grid" x1="90" y1="258" x2="520" y2="258"/>
<text class="s sm" x="84" y="262" text-anchor="end">10 µs</text>
<line class="axis" x1="110" y1="278" x2="110" y2="282"/>
<text class="s sm" x="110" y="296" text-anchor="middle">10,000</text>
<line class="axis" x1="300" y1="278" x2="300" y2="282"/>
<text class="s sm" x="300" y="296" text-anchor="middle">100,000</text>
<line class="axis" x1="490" y1="278" x2="490" y2="282"/>
<text class="s sm" x="490" y="296" text-anchor="middle">1,000,000</text>
<text class="s sm" x="300" y="314" text-anchor="middle">things of the kind</text>
<path class="ks" d="M 110 137 L 300 105 L 490 54"/>
<circle class="bg" cx="110" cy="137" r="6"/>
<circle class="off" cx="110" cy="137" r="4"/>
<circle class="bg" cx="300" cy="105" r="6"/>
<circle class="off" cx="300" cy="105" r="4"/>
<circle class="bg" cx="490" cy="54" r="6"/>
<circle class="off" cx="490" cy="54" r="4"/>
<text class="s sm" x="110" y="127" text-anchor="middle">2.10 ms</text>
<text class="s sm" x="300" y="95" text-anchor="middle">8.49 ms</text>
<text class="s sm" x="490" y="44" text-anchor="middle">81.4 ms</text>
<text class="h sm" x="504" y="54">the heap (before)</text>
<path class="k2" d="M 110 220 L 300 221 L 490 217"/>
<circle class="bg" cx="110" cy="220" r="6"/>
<circle class="s2" cx="110" cy="220" r="4"/>
<circle class="bg" cx="300" cy="221" r="6"/>
<circle class="s2" cx="300" cy="221" r="4"/>
<circle class="bg" cx="490" cy="217" r="6"/>
<circle class="s2" cx="490" cy="217" r="4"/>
<text class="s sm" x="110" y="210" text-anchor="middle">52.0 µs</text>
<text class="s sm" x="300" y="211" text-anchor="middle">51.0 µs</text>
<text class="s sm" x="490" y="207" text-anchor="middle">60.0 µs</text>
<text class="h sm" x="504" y="217">PostgreSQL 18.6</text>
<path class="k1" d="M 110 238 L 300 236 L 490 237"/>
<circle class="bg" cx="110" cy="238" r="6"/>
<circle class="s1" cx="110" cy="238" r="4"/>
<circle class="bg" cx="300" cy="236" r="6"/>
<circle class="s1" cx="300" cy="236" r="4"/>
<circle class="bg" cx="490" cy="237" r="6"/>
<circle class="s1" cx="490" cy="237" r="4"/>
<text class="s sm" x="110" y="258" text-anchor="middle">24.1 µs</text>
<text class="s sm" x="300" y="256" text-anchor="middle">25.7 µs</text>
<text class="s sm" x="490" y="257" text-anchor="middle">25.2 µs</text>
<text class="h sm" x="504" y="247">Cepheus</text>
<text class="s" x="16" y="338">Cepheus reads the property's column from the cursor, in the order of the ids, and its page costs the</text>
<text class="s" x="16" y="355">same at every size; PostgreSQL reads its primary key's B-tree from the cursor. Times:</text>
<text class="s" x="16" y="372">docs/book/benchmarks.md.</text>
</svg>
