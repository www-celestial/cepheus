<text class="s" x="16" y="400">11 rows, sorted by (client, date, invoice), 3 groups. Each with Limit: 3, the latest first, reads each group</text>
<text class="s" x="16" y="417">from its end, 3 rows (in blue), and asks the question with the invoice one of them; a page of one client by</text>
<text class="s" x="16" y="434">date seeks its cursor's date in the group, then reads its page. Read off a run the engine wrote</text>
<text class="s" x="16" y="451">(Snapshot.merge, run format 10).</text>
