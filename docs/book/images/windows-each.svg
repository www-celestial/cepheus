<svg xmlns="http://www.w3.org/2000/svg" width="520" height="380" viewBox="0 0 520 380">
<title>The invoices of 2028 by client, the latest first: Each by client and Limit 3 keep the first 3 of each</title>
<style>
text{font-family:system-ui, sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace, Menlo, Consolas, monospace;font-size:12.5px}
.h{font-weight:600}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.off{fill:#8c959f}
.row{fill:#fff;stroke:#d0d7de;stroke-width:1}
