<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380">
<title>Les factures de 2028 par client, la plus récente d'abord : Each par client et Limit 3 gardent les 3 premières de chacun</title>
<style>
