<rect class="row" x="634" y="34" width="31" height="28"/>
<rect class="row" x="665" y="34" width="31" height="28"/>
<path class="br" d="M 469 32 v -6 h 30 v 6"/>
<text class="a sm" x="484" y="78" text-anchor="middle">Read(..., from = 1_000_000, len = 65_536) : les 2 chunks sous la plage</text>
<text class="h" x="16" y="110">Le même fichier avec 100 octets insérés à l'octet 400 000</text>
<rect class="row" x="16" y="122" width="38" height="28"/>
<rect class="row" x="54" y="122" width="31" height="28"/>
<rect class="row" x="85" y="122" width="44" height="28"/>
<rect class="row" x="129" y="122" width="30" height="28"/>
<rect class="row" x="159" y="122" width="36" height="28"/>
<rect class="rowdel" x="195" y="122" width="38" height="28"/>
<rect class="row" x="233" y="122" width="47" height="28"/>
<rect class="row" x="280" y="122" width="35" height="28"/>
<rect class="row" x="315" y="122" width="30" height="28"/>
<rect class="row" x="345" y="122" width="36" height="28"/>
<rect class="row" x="381" y="122" width="34" height="28"/>
<rect class="row" x="415" y="122" width="34" height="28"/>
