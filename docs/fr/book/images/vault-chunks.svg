<svg xmlns="http://www.w3.org/2000/svg" width="712" height="344" viewBox="0 0 712 344">
<title>Un fichier coupé en chunks selon son contenu, les chunks que lit une lecture d'une plage, et une insertion qui laisse les autres chunks tels quels</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.bg{fill:#ffffff}
.row{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.cur{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.rowdel{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.br{stroke:#3a5ad9;stroke-width:1.4;fill:none}
.gr{stroke:#57606a;stroke-width:1.2;fill:none}
.fs{fill:#57606a}
.ldel{stroke:#cf222e;stroke-width:1.4;fill:none}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.bg{fill:#0d1117}
.row{fill:#161b22;stroke:#3d444d}
.box{fill:#1c2128;stroke:#3d444d}
.cur{fill:#1f2a4d;stroke:#8fa8ff}
.rowdel{fill:#2d1517;stroke:#f85149}
.br{stroke:#8fa8ff}
.gr{stroke:#9198a1}
.fs{fill:#9198a1}
.ldel{stroke:#f85149}
}
</style>
<rect class="bg" width="712" height="344"/>
<text class="h" x="16" y="22">Un fichier de 1 500 000 octets, coupé selon son contenu : 19 chunks de 16 à 256 Kio</text>
