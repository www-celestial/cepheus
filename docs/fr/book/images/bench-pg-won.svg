<text class="s sm" x="30" y="171">comme le serveur répond</text>
<text class="s sm" x="380" y="171" text-anchor="end">11,8 → 10,5 ms · 20,0 ms</text>
<line class="gr" x1="648" y1="167" x2="659" y2="167"/>
<circle class="bg" cx="648" cy="167" r="6"/>
<circle class="off" cx="648" cy="167" r="4"/>
<circle class="bg" cx="659" cy="167" r="7"/>
<circle class="s1" cx="659" cy="167" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="171"><tspan class="a">1,7×</tspan><tspan class="s"> → </tspan><tspan class="a h">1,9×</tspan></text>
<text class="sm" x="16" y="195">Optional, chaque valeur</text>
<text class="s sm" x="380" y="195" text-anchor="end">16,8 → 15,1 ms · 12,1 ms</text>
<line class="gr" x1="567" y1="191" x2="577" y2="191"/>
<circle class="bg" cx="567" cy="191" r="6"/>
<circle class="off" cx="567" cy="191" r="4"/>
<circle class="bg" cx="577" cy="191" r="7"/>
<circle class="s2" cx="577" cy="191" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="195"><tspan class="s2">1,4×</tspan><tspan class="s"> → </tspan><tspan class="s2 h">1,2×</tspan></text>
<text class="s sm" x="30" y="219">comme le serveur répond</text>
<text class="s sm" x="380" y="219" text-anchor="end">9,59 → 10,0 ms · 12,1 ms</text>
<line class="gr" x1="620" y1="215" x2="616" y2="215"/>
<circle class="bg" cx="620" cy="215" r="6"/>
<circle class="off" cx="620" cy="215" r="4"/>
<circle class="bg" cx="616" cy="215" r="7"/>
<circle class="s1" cx="616" cy="215" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="219"><tspan class="a">1,3×</tspan><tspan class="s"> → </tspan><tspan class="a h">1,2×</tspan></text>
<text class="sm" x="16" y="243">Rank(), 1 groupe</text>
<text class="s sm" x="380" y="243" text-anchor="end">213 → 96,1 ms · 181 ms</text>
<line class="gr" x1="583" y1="239" x2="645" y2="239"/>
<polygon class="fs" points="651.0,239.0 643.0,235.0 643.0,243.0"/>
<circle class="bg" cx="583" cy="239" r="6"/>
<circle class="off" cx="583" cy="239" r="4"/>
<circle class="bg" cx="658" cy="239" r="7"/>
<circle class="s1" cx="658" cy="239" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="243"><tspan class="s2">1,2×</tspan><tspan class="s"> → </tspan><tspan class="a h">1,9×</tspan></text>
<text class="sm" x="16" y="267">Rank(), 100 groupes</text>
<text class="s sm" x="380" y="267" text-anchor="end">236 → 115 ms · 361 ms</text>
<line class="gr" x1="638" y1="263" x2="693" y2="263"/>
<polygon class="fs" points="699.0,263.0 691.0,259.0 691.0,267.0"/>
<circle class="bg" cx="638" cy="263" r="6"/>
<circle class="off" cx="638" cy="263" r="4"/>
<circle class="bg" cx="706" cy="263" r="7"/>
<circle class="s1" cx="706" cy="263" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="267"><tspan class="a">1,5×</tspan><tspan class="s"> → </tspan><tspan class="a h">3,1×</tspan></text>
<text class="sm" x="16" y="291">Rank(), 10 000 groupes</text>
<text class="s sm" x="380" y="291" text-anchor="end">261 → 134 ms · 244 ms</text>
<line class="gr" x1="592" y1="287" x2="642" y2="287"/>
<polygon class="fs" points="648.0,287.0 640.0,283.0 640.0,291.0"/>
<circle class="bg" cx="592" cy="287" r="6"/>
<circle class="off" cx="592" cy="287" r="4"/>
<circle class="bg" cx="655" cy="287" r="7"/>
<circle class="s1" cx="655" cy="287" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="291"><tspan class="s">1,1×</tspan><tspan class="s"> → </tspan><tspan class="a h">1,8×</tspan></text>
<text class="sm" x="16" y="315">Each, Limit: 3 (LATERAL)</text>
<text class="s sm" x="380" y="315" text-anchor="end">137 → 106 ms · 53,8 ms</text>
<line class="gr" x1="510" y1="311" x2="521" y2="311"/>
<polygon class="fs" points="527.0,311.0 519.0,307.0 519.0,315.0"/>
<circle class="bg" cx="510" cy="311" r="6"/>
<circle class="off" cx="510" cy="311" r="4"/>
<circle class="bg" cx="534" cy="311" r="7"/>
<circle class="s2" cx="534" cy="311" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="315"><tspan class="s2">2,5×</tspan><tspan class="s"> → </tspan><tspan class="s2 h">2,0×</tspan></text>
<text class="sm" x="16" y="339">Limit: 1 (DISTINCT ON)</text>
<text class="s sm" x="380" y="339" text-anchor="end">102 → 88,8 ms · 113 ms</text>
<line class="gr" x1="607" y1="335" x2="620" y2="335"/>
<circle class="bg" cx="607" cy="335" r="6"/>
<circle class="off" cx="607" cy="335" r="4"/>
<circle class="bg" cx="620" cy="335" r="7"/>
<circle class="s1" cx="620" cy="335" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="339"><tspan class="a">1,1×</tspan><tspan class="s"> → </tspan><tspan class="a h">1,3×</tspan></text>
<text class="sm" x="16" y="363">cascade, 10 000 lignes</text>
<text class="s sm" x="380" y="363" text-anchor="end">30,0 → 21,8 ms · 5,18 ms</text>
<line class="gr" x1="431" y1="359" x2="449" y2="359"/>
<polygon class="fs" points="455.0,359.0 447.0,355.0 447.0,363.0"/>
<circle class="bg" cx="431" cy="359" r="6"/>
<circle class="off" cx="431" cy="359" r="4"/>
<circle class="bg" cx="462" cy="359" r="7"/>
<circle class="s2" cx="462" cy="359" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="363"><tspan class="s2">5,8×</tspan><tspan class="s"> → </tspan><tspan class="s2 h">4,2×</tspan></text>
<text class="sm" x="16" y="387">cascade, 100 lignes</text>
<text class="s sm" x="380" y="387" text-anchor="end">215 → 148 µs · 201 µs</text>
<line class="gr" x1="592" y1="383" x2="614" y2="383"/>
<polygon class="fs" points="620.0,383.0 612.0,379.0 612.0,387.0"/>
<circle class="bg" cx="592" cy="383" r="6"/>
<circle class="off" cx="592" cy="383" r="4"/>
<circle class="bg" cx="627" cy="383" r="7"/>
<circle class="s1" cx="627" cy="383" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="387"><tspan class="s">1,1×</tspan><tspan class="s"> → </tspan><tspan class="a h">1,4×</tspan></text>
<text class="s" x="16" y="420">Le point gris : les binaires de main (af9fb51) ; le point en couleur : maintenant (d96aa73) ; sur une échelle</text>
<text class="s" x="16" y="437">logarithmique du temps de PostgreSQL 18.6 sur celui de Cepheus : la médiane de 5 tours alternés sur les mêmes lignes.</text>
<text class="s" x="16" y="454">Un rapport en bleu, Cepheus est plus rapide ; en orange, PostgreSQL ; en gris, à 10 % près. « Comme le serveur</text>
<text class="s" x="16" y="471">répond » fait les mots d'index de chaque ligne, pas ses valeurs. Temps : docs/book/benchmarks.md.</text>
</svg>
