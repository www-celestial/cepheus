<svg xmlns="http://www.w3.org/2000/svg" width="860" height="488" viewBox="0 0 860 488">
<title>Les cas que PostgreSQL gagnait encore : combien de fois chaque côté était plus rapide avec main et l'est maintenant, question par question</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
