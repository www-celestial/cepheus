<circle class="bg" cx="597" cy="119" r="7"/>
<circle class="off" cx="597" cy="119" r="5"/>
<text class="sm" xml:space="preserve" x="742" y="123"><tspan class="s">1,1×</tspan><tspan class="s"> → </tspan><tspan class="s h">1,0×</tspan></text>
<text class="sm" x="16" y="147">Less, un intervalle, chaque valeur</text>
<text class="s sm" x="380" y="147" text-anchor="end">31,4 → 21,9 ms · 20,0 ms</text>
<line class="gr" x1="556" y1="143" x2="577" y2="143"/>
<polygon class="fs" points="583.0,143.0 575.0,139.0 575.0,147.0"/>
