<text class="s sm" x="30" y="123">comme le serveur répond</text>
<text class="s sm" x="380" y="123" text-anchor="end">3,96 → 3,70 ms · 3,64 ms</text>
<line class="gr" x1="590" y1="119" x2="597" y2="119"/>
