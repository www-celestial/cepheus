<rect class="bg" width="860" height="488"/>
<text class="h" x="16" y="22">Les cas que PostgreSQL gagnait encore, à 1 million de faits : main, puis maintenant</text>
<text class="s sm" x="380" y="54" text-anchor="end">main → maintenant · PostgreSQL</text>
<text class="a sm" x="606" y="54">Cepheus plus rapide →</text>
<text class="sm" x="590" y="54" text-anchor="end">← PostgreSQL plus rapide</text>
<text class="s sm" x="742" y="54">main → maintenant</text>
<line class="grid" x1="401" y1="68" x2="401" y2="396"/>
<text class="s sm" x="401" y="78" text-anchor="middle">8×</text>
<line class="grid" x1="467" y1="68" x2="467" y2="396"/>
<text class="s sm" x="467" y="78" text-anchor="middle">4×</text>
<line class="grid" x1="533" y1="68" x2="533" y2="396"/>
<text class="s sm" x="533" y="78" text-anchor="middle">2×</text>
<line class="grid" x1="598" y1="68" x2="598" y2="396"/>
<text class="s sm" x="598" y="78" text-anchor="middle">1×</text>
<line class="grid" x1="663" y1="68" x2="663" y2="396"/>
<text class="s sm" x="663" y="78" text-anchor="middle">2×</text>
<line class="grid" x1="729" y1="68" x2="729" y2="396"/>
<text class="s sm" x="729" y="78" text-anchor="middle">4×</text>
