<svg xmlns="http://www.w3.org/2000/svg" width="712" height="272" viewBox="0 0 712 272">
<title>Un failover dans un cluster Raft de 3 : le leader tué, une élection, un nouveau leader prêt après 893 ms en médiane</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.del{fill:#cf222e}
.bg{fill:#ffffff}
.cur{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.frame{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.2;stroke-dasharray:4 3}
.dash{fill:none;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 3}
.br{stroke:#3a5ad9;stroke-width:1.4;fill:none}
.gr{stroke:#57606a;stroke-width:1.2;fill:none}
.grid{stroke:#eaeef2;stroke-width:1}
.axis{stroke:#8c959f;stroke-width:1}
.fs{fill:#57606a}
.s1{fill:#257de0}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.del{fill:#f85149}
.bg{fill:#0d1117}
.cur{fill:#1f2a4d;stroke:#8fa8ff}
.frame{fill:#1f2a4d;stroke:#8fa8ff}
.dash{stroke:#6e7681}
.br{stroke:#8fa8ff}
.gr{stroke:#9198a1}
.grid{stroke:#262c36}
.axis{stroke:#6e7681}
.fs{fill:#9198a1}
.s1{fill:#338ced}
}
</style>
<rect class="bg" width="712" height="272"/>
<text class="h" x="16" y="54">srv1</text>
<text class="h" x="16" y="96">srv2</text>
<text class="h" x="16" y="138">srv3</text>
<text class="h" x="16" y="180">programme</text>
<line class="grid" x1="130" y1="50" x2="690" y2="50"/>
<line class="grid" x1="130" y1="92" x2="690" y2="92"/>
<line class="grid" x1="130" y1="134" x2="690" y2="134"/>
<line class="grid" x1="130" y1="176" x2="690" y2="176"/>
<line class="br" x1="112" y1="44" x2="112" y2="56"/>
<line class="br" x1="93" y1="44" x2="93" y2="56"/>
<line class="br" x1="74" y1="44" x2="74" y2="56"/>
<text class="del h" x="130" y="55" text-anchor="middle">✕</text>
<text class="sm" xml:space="preserve" x="142" y="54"><tspan class="del">kill -9</tspan><tspan class="s">   (avant lui, un heartbeat toutes les 50 ms)</tspan></text>
<rect class="frame" x="316" y="83" width="187" height="18"/>
<line class="dash" x1="130" y1="92" x2="316" y2="92"/>
<rect class="frame" x="316" y="125" width="187" height="18"/>
<line class="dash" x1="130" y1="134" x2="316" y2="134"/>
<text class="a sm" x="322" y="138">timeout : 500 + 0 à 500 ms</text>
<rect class="cur" x="455" y="82" width="8" height="20" rx="3"/>
<text class="a sm" x="449" y="78" text-anchor="end">délai passé : pre-vote, vote (fsync)</text>
<text class="a sm" x="469" y="96">leader : no-op (fsync), prêt</text>
<line class="gr" x1="455" y1="102" x2="455" y2="118"/>
<polygon class="fs" points="455.0,124.0 459.0,116.0 451.0,116.0"/>
<line class="gr" x1="461" y1="124" x2="461" y2="108"/>
<polygon class="fs" points="461.0,102.0 457.0,110.0 465.0,110.0"/>
<line class="dash" x1="130" y1="176" x2="469" y2="176"/>
<text class="s sm" x="144" y="168">les écritures attendent : pas de leader</text>
<circle class="s1" cx="469" cy="176" r="6"/>
<text class="a sm" x="479" y="180">première écriture committed, 910 ms</text>
<line class="axis" x1="130" y1="206" x2="690" y2="206"/>
<line class="axis" x1="130" y1="206" x2="130" y2="210"/>
<text class="s sm" x="130" y="222" text-anchor="middle">0</text>
<line class="axis" x1="223" y1="206" x2="223" y2="210"/>
<text class="s sm" x="223" y="222" text-anchor="middle">250</text>
<line class="axis" x1="316" y1="206" x2="316" y2="210"/>
<text class="s sm" x="316" y="222" text-anchor="middle">500</text>
<line class="axis" x1="410" y1="206" x2="410" y2="210"/>
<text class="s sm" x="410" y="222" text-anchor="middle">750</text>
<line class="axis" x1="503" y1="206" x2="503" y2="210"/>
<text class="s sm" x="503" y="222" text-anchor="middle">1000</text>
<line class="axis" x1="596" y1="206" x2="596" y2="210"/>
<text class="s sm" x="596" y="222" text-anchor="middle">1250</text>
<line class="axis" x1="690" y1="206" x2="690" y2="210"/>
<text class="s sm" x="690" y="222" text-anchor="middle">1500</text>
<text class="s sm" x="16" y="222">ms</text>
<rect class="frame" x="337" y="232" width="313" height="10"/>
<line class="br" x1="463" y1="228" x2="463" y2="246"/>
<text class="a sm" x="337" y="260">un leader prêt en 21 failovers : 557 à 1 395 ms, médiane 893</text>
</svg>
