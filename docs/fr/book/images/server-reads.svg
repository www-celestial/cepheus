<svg xmlns="http://www.w3.org/2000/svg" width="712" height="384" viewBox="0 0 712 384">
<title>Le serveur, et une lecture de trois façons : par TCP et TLS, par le socket Unix, et en lecture locale</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.bg{fill:#ffffff}
.row{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.box{fill:#f6f8fa;stroke:#d0d7de;stroke-width:1}
.cur{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.br{stroke:#3a5ad9;stroke-width:1.4;fill:none}
.gr{stroke:#57606a;stroke-width:1.2;fill:none}
.fa{fill:#3a5ad9}
.fs{fill:#57606a}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.bg{fill:#0d1117}
.row{fill:#161b22;stroke:#3d444d}
.box{fill:#1c2128;stroke:#3d444d}
.cur{fill:#1f2a4d;stroke:#8fa8ff}
.br{stroke:#8fa8ff}
.gr{stroke:#9198a1}
.fa{fill:#8fa8ff}
.fs{fill:#9198a1}
}
</style>
<rect class="bg" width="712" height="384"/>
<rect class="box" x="16" y="16" width="280" height="352" rx="6"/>
<text class="c h" xml:space="preserve" x="28" y="38">cepheus serve</text>
<rect class="row" x="28" y="50" width="256" height="62" rx="4"/>
<text class="h" x="38" y="68">listeners</text>
<text class="c" xml:space="preserve" x="38" y="88">DIR/.s.cepheus.PORT</text>
<text class="c" xml:space="preserve" x="38" y="105">TCP host:port, TLS 1.3</text>
<rect class="row" x="28" y="120" width="256" height="38" rx="4"/>
<text class="h" x="38" y="138">I/O domains : un thread par connexion</text>
<rect class="row" x="28" y="164" width="256" height="92" rx="4"/>
<text class="h" x="38" y="182">une base</text>
<text x="38" y="202">writer, syncer, merges</text>
<text class="c" xml:space="preserve" x="38" y="219">journal/*.seg  snapshots/*.run</text>
<text x="38" y="236">ses vues : runs + delta</text>
<rect class="row" x="28" y="264" width="256" height="40" rx="4"/>
<text class="h" x="38" y="282">commit buffer</text>
<text class="s sm" x="146" y="282">un fsync par tour,</text>
<text class="s sm" x="146" y="296">toutes les bases</text>
<rect class="row" x="28" y="312" width="256" height="46" rx="4"/>
<text class="h" x="38" y="330">la page de visibilité</text>
<text class="c s sm" xml:space="preserve" x="38" y="350">/dev/shm/cepheus-ID.visible</text>
<rect class="row" x="462" y="40" width="234" height="70" rx="4"/>
<text class="h" x="472" y="58">un programme ailleurs</text>
<text class="s sm" x="472" y="78">TCP + TLS 1.3</text>
<text class="a h" x="686" y="100" text-anchor="end">41,3 µs par lecture</text>
<line class="gr" x1="458" y1="72" x2="298" y2="72"/>
<polygon class="fs" points="292.0,72.0 300.0,76.0 300.0,68.0"/>
<line class="gr" x1="292" y1="72" x2="452" y2="72"/>
<polygon class="fs" points="458.0,72.0 450.0,68.0 450.0,76.0"/>
<rect class="row" x="462" y="140" width="234" height="70" rx="4"/>
<text class="h" x="472" y="158">un programme sur cette machine</text>
<text class="s sm" x="472" y="178">Unix socket</text>
<text class="a h" x="686" y="200" text-anchor="end">9,7 µs par lecture</text>
<line class="gr" x1="458" y1="168" x2="297" y2="98"/>
<polygon class="fs" points="292.0,96.0 297.7,102.9 300.9,95.5"/>
<line class="gr" x1="292" y1="96" x2="453" y2="166"/>
<polygon class="fs" points="458.0,168.0 452.3,161.1 449.1,168.5"/>
<text class="s sm" x="308" y="62">requêtes, réponses</text>
<rect class="cur" x="462" y="236" width="234" height="132" rx="4"/>
<text class="h" x="472" y="254">un programme, lectures locales</text>
<text class="sm" x="472" y="274">son follower : les fichiers run</text>
<text class="sm" x="472" y="290">et les frames comme elles viennent</text>
<text class="sm" x="472" y="306">lit dans sa propre mémoire,</text>
<text class="sm" x="472" y="322">jusqu'au numéro de visibilité</text>
<text class="a h" x="686" y="358" text-anchor="end">0,22 µs par lecture</text>
<path class="br" d="M 292 210 C 375 210, 375 254, 452 254"/>
<polygon class="fa" points="458.0,254.0 450.0,250.0 450.0,258.0"/>
<text class="a sm" x="308" y="250">follow stream:</text>
<text class="a sm" x="308" y="264">Start (descripteurs),</text>
<text class="a sm" x="308" y="278">Frame, Runs</text>
<line class="br" x1="292" y1="335" x2="456" y2="335"/>
<polygon class="fa" points="458.0,335.0 450.0,331.0 450.0,339.0"/>
<text class="a sm" x="308" y="328">mappée en lecture seule</text>
</svg>
