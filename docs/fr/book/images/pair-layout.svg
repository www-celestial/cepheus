<text class="s" x="16" y="400">11 lignes, triées par (client, date, facture), 3 groupes. Each avec Limit: 3, la plus récente d'abord, lit</text>
<text class="s" x="16" y="417">chaque groupe par sa fin, 3 lignes (en bleu), et pose la question avec la facture l'une d'elles ; une page</text>
<text class="s" x="16" y="434">d'un client par date cherche la date de son curseur dans le groupe, puis lit sa page. Lu dans un run que le</text>
<text class="s" x="16" y="451">moteur a écrit (Snapshot.merge, le format de run 10).</text>
