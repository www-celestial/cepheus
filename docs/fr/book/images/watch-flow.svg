<svg xmlns="http://www.w3.org/2000/svg" width="712" height="347" viewBox="0 0 712 347">
<title>Une watch : les changements d'un groupe calculés une fois par template, envoyés aux watches dont ils touchent les constantes, chaque fiber sa copie</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.bg{fill:#ffffff}
.row{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
.cur{fill:#eef1fc;stroke:#3a5ad9;stroke-width:1.6}
.rowadd{fill:#dafbe1;stroke:#1a7f37;stroke-width:1.2}
.rowdel{fill:#ffebe9;stroke:#cf222e;stroke-width:1.2}
.br{stroke:#3a5ad9;stroke-width:1.4;fill:none}
.fa{fill:#3a5ad9}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.bg{fill:#0d1117}
.row{fill:#161b22;stroke:#3d444d}
.cur{fill:#1f2a4d;stroke:#8fa8ff}
.rowadd{fill:#12261e;stroke:#3fb950}
.rowdel{fill:#2d1517;stroke:#f85149}
.br{stroke:#8fa8ff}
.fa{fill:#8fa8ff}
}
</style>
<rect class="bg" width="712" height="347"/>
<text class="h" x="16" y="22">Groupes, une fois sur le disque</text>
<rect class="rowadd" x="16" y="34" width="196" height="46" rx="4"/>
<text class="h" x="26" y="52">groupe 15</text>
<text class="c" xml:space="preserve" x="26" y="72">+ 65546 ada unpaid 45</text>
<rect class="rowdel" x="16" y="90" width="196" height="46" rx="4"/>
<text class="h" x="26" y="108">groupe 16</text>
<text class="c" xml:space="preserve" x="26" y="128">- 65546 unpaid, + paid</text>
<text class="h" x="252" y="22">Un template, ses constantes</text>
<rect class="cur" x="252" y="34" width="222" height="102" rx="4"/>
<text class="c a" xml:space="preserve" x="262" y="54">unpaidOf(c)</text>
<text class="c" xml:space="preserve" x="262" y="74">[i, Client, c]</text>
<text class="c" xml:space="preserve" x="262" y="90">[i, Status, "unpaid"]</text>
<text class="c" xml:space="preserve" x="262" y="106">[i, Total, total]</text>
<text class="s sm" x="262" y="126">delta query : une fois par changement</text>
<path class="br" d="M 212 57 C 231 57, 231 70, 244 70"/>
<polygon class="fa" points="250.0,70.0 242.0,66.0 242.0,74.0"/>
<path class="br" d="M 212 113 C 231 113, 231 100, 244 100"/>
<polygon class="fa" points="250.0,100.0 242.0,96.0 242.0,104.0"/>
<text class="h" x="500" y="22">Watches, leurs fibers</text>
<rect class="row" x="500" y="34" width="196" height="62" rx="4"/>
<text class="h" x="510" y="52">c = ada</text>
<text class="s sm" x="510" y="72">les fibers A et B la partagent</text>
<rect class="row" x="500" y="106" width="196" height="46" rx="4"/>
<text class="h" x="510" y="124">c = bo</text>
<text class="s sm" x="510" y="144">ses lignes inchangées : rien</text>
<path class="br" d="M 474 70 C 486 70, 486 64, 492 64"/>
<polygon class="fa" points="498.0,64.0 490.0,60.0 490.0,68.0"/>
<text class="h" x="16" y="172">Ce que reçoit la fiber A, dans l'ordre (la fiber B la même chose, une copie)</text>
<rect class="row" x="16" y="184" width="680" height="22"/>
<text class="c sm" xml:space="preserve" x="24" y="199">Ok({Group: 14, Rows: [{Invoice: 65538, Total: 80.5}], Added: missing, Removed: missing})</text>
<rect class="rowadd" x="16" y="212" width="680" height="22"/>
<text class="c sm" xml:space="preserve" x="24" y="227">Ok({Group: 15, Rows: missing, Added: [{Invoice: 65546, Total: 45.0}], Removed: []})</text>
<rect class="rowdel" x="16" y="240" width="680" height="22"/>
<text class="c sm" xml:space="preserve" x="24" y="255">Ok({Group: 16, Rows: missing, Added: [], Removed: [{Invoice: 65546, Total: 45.0}]})</text>
<text class="s" x="16" y="286">Le premier message est la réponse au groupe de la watch ; chaque suivant, les lignes venues et parties avec</text>
<text class="s" x="16" y="303">un groupe, envoyées une fois ce groupe sur le disque du serveur. Un groupe coûte autant avec 10 watches</text>
<text class="s" x="16" y="320">d'un template qu'avec 10 000.</text>
</svg>
