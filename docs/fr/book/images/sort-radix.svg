<text class="s" x="16" y="412">5 passes, chacune un compte du chiffre des 11 clés et 11 déplacements, stable, sans comparaison : le chiffre 0</text>
<text class="s" x="16" y="429">d'abord (en bleu), le chiffre 4 en dernier. Les 4 factures de 500 (en pointillés) partagent leurs bits hauts ; leurs</text>
<text class="s" x="16" y="446">dates, dans les bits bas, les ordonnent. Le tri par comparaisons donne le même ordre, ligne pour ligne.</text>
