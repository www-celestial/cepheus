<svg xmlns="http://www.w3.org/2000/svg" width="712" height="508" viewBox="0 0 712 508">
<title>Windows et Each à côté de PostgreSQL : combien de fois chaque côté est plus rapide, question par question</title>
<style>
text{font-family:system-ui,sans-serif;font-size:13px;fill:#1f2328}
.h{font-weight:600}
.sm{font-size:11.5px}
.s{fill:#57606a}
.a{fill:#3a5ad9}
.off{fill:#8c959f}
.bg{fill:#ffffff}
.grid{stroke:#eaeef2;stroke-width:1}
.axis{stroke:#8c959f;stroke-width:1}
.s1{fill:#257de0}
.s2{fill:#f47230}
@media (prefers-color-scheme:dark){
text{fill:#e6edf3}
.s{fill:#9198a1}
.a{fill:#8fa8ff}
.off{fill:#6e7681}
.bg{fill:#0d1117}
.grid{stroke:#262c36}
.axis{stroke:#6e7681}
.s1{fill:#338ced}
.s2{fill:#e76624}
}
</style>
<rect class="bg" width="712" height="508"/>
<text class="h" x="16" y="22">Windows et Each à 1 million de faits, la médiane de 5 tours</text>
<text class="s sm" x="350" y="46" text-anchor="end">Cepheus · PostgreSQL</text>
<text class="a sm" x="494" y="46">Cepheus plus rapide →</text>
<text class="sm" x="478" y="46" text-anchor="end">← PostgreSQL plus rapide</text>
<line class="grid" x1="432" y1="60" x2="432" y2="450"/>
<text class="s sm" x="432" y="70" text-anchor="middle">2×</text>
<line class="grid" x1="486" y1="60" x2="486" y2="450"/>
<text class="s sm" x="486" y="70" text-anchor="middle">1×</text>
<line class="grid" x1="540" y1="60" x2="540" y2="450"/>
<text class="s sm" x="540" y="70" text-anchor="middle">2×</text>
<line class="grid" x1="594" y1="60" x2="594" y2="450"/>
<text class="s sm" x="594" y="70" text-anchor="middle">4×</text>
<line class="grid" x1="648" y1="60" x2="648" y2="450"/>
<text class="s sm" x="648" y="70" text-anchor="middle">8×</text>
<line class="axis" x1="486" y1="60" x2="486" y2="450"/>
<text class="sm" x="16" y="91">Running(Sum(t)), 1 groupe</text>
<text class="s sm" x="350" y="91" text-anchor="end">155 ms · 264 ms</text>
<rect class="s1" x="486" y="81" width="41" height="13" rx="2"/>
<text class="sm h" x="532" y="92">1,7×</text>
<text class="sm" x="16" y="113">Running(Sum(t)), 100 groupes</text>
<text class="s sm" x="350" y="113" text-anchor="end">358 ms · 467 ms</text>
<rect class="s1" x="486" y="103" width="20" height="13" rx="2"/>
<text class="sm h" x="511" y="114">1,3×</text>
<text class="sm" x="16" y="135">Running(Sum(t)), 10, 10 000 groupes</text>
<text class="s sm" x="350" y="135" text-anchor="end">170 ms · 270 ms</text>
<rect class="s1" x="486" y="125" width="36" height="13" rx="2"/>
<text class="sm h" x="527" y="136">1,6×</text>
<text class="sm" x="16" y="157">Running(Avg(t), last = 3), 1 groupe</text>
<text class="s sm" x="350" y="157" text-anchor="end">141 ms · 444 ms</text>
<rect class="s1" x="486" y="147" width="90" height="13" rx="2"/>
<text class="sm h" x="581" y="158">3,2×</text>
<text class="sm" x="16" y="179">Running(Avg(t), last = 3), 100 groupes</text>
<text class="s sm" x="350" y="179" text-anchor="end">282 ms · 467 ms</text>
<rect class="s1" x="486" y="169" width="41" height="13" rx="2"/>
<text class="sm h" x="532" y="180">1,7×</text>
<text class="sm" x="16" y="201">Running(Avg(t), last = 3), 10, 10 000 groupes</text>
<text class="s sm" x="350" y="201" text-anchor="end">185 ms · 351 ms</text>
<rect class="s1" x="486" y="191" width="50" height="13" rx="2"/>
<text class="sm h" x="541" y="202">1,9×</text>
<text class="sm" x="16" y="223">Rank(), 1 groupe</text>
<text class="s sm" x="350" y="223" text-anchor="end">252 ms · 216 ms</text>
<rect class="s2" x="472" y="213" width="14" height="13" rx="2"/>
<text class="sm h" x="467" y="224" text-anchor="end">1,2×</text>
<text class="sm" x="16" y="245">Rank(), 100 groupes</text>
<text class="s sm" x="350" y="245" text-anchor="end">281 ms · 373 ms</text>
<rect class="s1" x="486" y="235" width="20" height="13" rx="2"/>
<text class="sm h" x="511" y="246">1,3×</text>
<text class="sm" x="16" y="267">Rank(), 10, 10 000 groupes</text>
<text class="s sm" x="350" y="267" text-anchor="end">260 ms · 270 ms</text>
<rect class="off" x="486" y="257" width="2" height="13" rx="2"/>
<text class="sm h" x="493" y="268">1,0×</text>
<text class="sm" x="16" y="289">Prev(d), 1 groupe</text>
<text class="s sm" x="350" y="289" text-anchor="end">130 ms · 293 ms</text>
<rect class="s1" x="486" y="279" width="65" height="13" rx="2"/>
<text class="sm h" x="556" y="290">2,3×</text>
<text class="sm" x="16" y="311">Prev(d), 100 groupes</text>
<text class="s sm" x="350" y="311" text-anchor="end">241 ms · 351 ms</text>
<rect class="s1" x="486" y="301" width="31" height="13" rx="2"/>
<text class="sm h" x="522" y="312">1,5×</text>
<text class="sm" x="16" y="333">Prev(d), 10, 10 000 groupes</text>
<text class="s sm" x="350" y="333" text-anchor="end">124 ms · 262 ms</text>
<rect class="s1" x="486" y="323" width="57" height="13" rx="2"/>
<text class="sm h" x="548" y="334">2,1×</text>
<text class="sm" x="16" y="355">Each, Limit: 3 (LATERAL)</text>
<text class="s sm" x="350" y="355" text-anchor="end">131 ms · 55,9 ms</text>
<rect class="s2" x="421" y="345" width="65" height="13" rx="2"/>
<text class="sm h" x="416" y="356" text-anchor="end">2,3×</text>
<text class="sm" x="16" y="377">Limit: 1 (DISTINCT ON)</text>
<text class="s sm" x="350" y="377" text-anchor="end">151 ms · 127 ms</text>
<rect class="s2" x="472" y="367" width="14" height="13" rx="2"/>
<text class="sm h" x="467" y="378" text-anchor="end">1,2×</text>
<text class="sm" x="16" y="399">rapport de 121 mois</text>
<text class="s sm" x="350" y="399" text-anchor="end">23,9 ms · 188 ms</text>
<rect class="s1" x="486" y="389" width="161" height="13" rx="2"/>
<text class="sm h" x="652" y="400">7,9×</text>
<text class="sm" x="16" y="421">page après la 200 000e</text>
<text class="s sm" x="350" y="421" text-anchor="end">76,7 ms · 197 ms</text>
<rect class="s1" x="486" y="411" width="74" height="13" rx="2"/>
<text class="sm h" x="565" y="422">2,6×</text>
<text class="sm" x="16" y="443">première page de 51</text>
<text class="s sm" x="350" y="443" text-anchor="end">97 µs · 183 µs</text>
<rect class="s1" x="486" y="433" width="50" height="13" rx="2"/>
<text class="sm h" x="541" y="444">1,9×</text>
<text class="s" x="16" y="474">PostgreSQL 18.6 avec les index que son utilisateur crée pour ces questions ; son LATERAL lit 3 lignes</text>
<text class="s" x="16" y="491">par client dans l'un d'eux, Cepheus les 245 000 factures une fois. Temps : docs/book/benchmarks.md.</text>
</svg>
