[project]
name = "invoices"
cesia = "1.1"

[deps.cepheus]
from = "github.com/www-celestial/cepheus"
version = "v0.1.0"
take = ["cesia/cepheus"]

# Ceti drives Firefox in the end-to-end tests (tests/e2e, tools/e2e.sh).
[deps.ceti]
from = "github.com/www-celestial/ceti"
version = "v0.1.0"
take = ["src/browser"]

# The server: the package's engine (native=cepheus, which reaches the Cepheus server), libsodium for the passwords
# and the sessions, its settings, and its port. It reads and writes no file.
[tasks.serve]
file = "src/main.ce"
allow = ["native=cepheus", "ffi=sodium", "env=CEPHEUS_URL", "env=CEPHEUS_TOKEN", "env=CEPHEUS_BOOKS_TOKEN", "env=APP_PORT", "env=APP_HOST", "env=APP_CERT", "env=APP_KEY", "net=:8090"]

# In production: https on every address, port 8443, its certificate and key in /etc/invoices (OpenSSL: ffi=ssl,crypto).
[tasks.serve-tls]
file = "src/main.ce"
allow = ["native=cepheus", "ffi=sodium", "ffi=ssl", "ffi=crypto", "env=CEPHEUS_URL", "env=CEPHEUS_TOKEN", "env=CEPHEUS_BOOKS_TOKEN", "env=APP_PORT", "env=APP_HOST", "env=APP_CERT", "env=APP_KEY", "read=/etc/invoices", "net=0.0.0.0:8443"]

# APP_LOGIN=ada APP_ROLE=admin APP_PASSWORD=... cesia do users: a user of the app.
[tasks.users]
file = "src/users/users.ce"
allow = ["native=cepheus", "ffi=sodium", "env=CEPHEUS_URL", "env=CEPHEUS_TOKEN", "env=APP_LOGIN", "env=APP_ROLE", "env=APP_PASSWORD"]

# The unit tests run on forks of Empty: no server, only the package's engine; and libsodium for the passwords. The
# end-to-end tests share a database, so they run alone, one after the other; Firefox takes a few seconds to start.
[test]
allow = ["native=cepheus", "ffi=sodium"]
serial = ["tests/e2e"]
timeout = "60"

# cesia do seed: 10,000 clients and 100,000 invoices in an empty database, always the same (the seed 7).
[tasks.seed]
file = "src/seed/seed.ce"
allow = ["native=cepheus", "env=CEPHEUS_URL", "env=CEPHEUS_TOKEN"]
